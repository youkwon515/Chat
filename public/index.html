<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정유권 채팅</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="prof-img"></div>
      <div class="prof-content">
        <p>정유권</p>
        <p class="user-count">현재 활동 중</p>
      </div>
    </header>
    <main>
      <ul class="chat"></ul>
      <form class="chat-form">
        <div class="form-inp">
          <input type="text" class="inp" autocomplete="off" placeholder="메시지 입력..." />
        </div>
        <button type="submit" class="send"><div class="send-img"></div></button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const Chat = document.querySelector('.chat');
    const ChatForm = document.querySelector('.chat-form');
    const messageInput = document.querySelector('.inp');
    const userCountDisplay = document.querySelector('.user-count');

    ChatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = socket.id;
      const message = messageInput.value.trim();

      if (message !== '') {
        socket.emit('chat message', { id, message });
        const li = document.createElement('li');
        li.textContent = `${message}`;
        li.classList.add('me')
        Chat.appendChild(li);
        messageInput.value = '';
      }
    });

    socket.on('chat message', (data) => {
      if (data.id !== socket.id) {
        const li = document.createElement('li');
        li.textContent = `${data.message}`;
        Chat.appendChild(li);
      }
    });

    socket.on('user count', (count) => {
        userCountDisplay.textContent = `현재 활동 중...(${count})`;
    });
  </script>
</body>
</html>
