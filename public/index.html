<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정유권의 채팅방</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="prof-img"></div>
      <div class="prof-content">
        <p>정유권의 채팅방</p>
        <p class="user-count">현재 활동 중</p>
      </div>
    </header>
    <main>
      <ul class="chat"></ul>
      <form class="chat-form">
        <div class="form-inp">
          <label for="image-input" class="image-upload">
            <input type="file" class="inp-img" id="image-input" accept="image/*" />
            <div class="upload-icon"></div>
          </label>
          
          <input type="text" class="inp" autocomplete="off" placeholder="메시지 입력..." />
        </div>
        <button type="submit" class="send"><div class="send-img"></div></button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const Chat = document.querySelector('.chat');
    const ChatForm = document.querySelector('.chat-form');
    const messageInput = document.querySelector('.inp');
    const userCountDisplay = document.querySelector('.user-count');
    const imageInput = document.querySelector('.inp-img');
    const MAX_IMAGE_SIZE = 2 * 1024 * 1024;


    const uploadIcon = document.querySelector('.upload-icon');
    imageInput.addEventListener('change', () => {
      if (imageInput.files.length > 0) {
        uploadIcon.classList.add('selected');
        messageInput.placeholder = '사진이 선택되었습니다.';
        messageInput.disabled = true;
      } else {
        uploadIcon.classList.remove('selected');
        messageInput.placeholder = '메시지 입력...';
        messageInput.disabled = false;
      }
    });

    ChatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = socket.id;
      const message = messageInput.value.trim();

      if (imageInput.files.length > 0) {
        const file = imageInput.files[0];

        if (file.size > MAX_IMAGE_SIZE) {
          alert('잠만여 이미지가 너무 큼;;');
          return;
        }

        const reader = new FileReader();

        reader.onloadend = () => {
            const base64Image = reader.result;
            socket.emit('chat message', { id, message: base64Image });
            addMessageToChat(base64Image, true);

            imageInput.value = '';
            uploadIcon.classList.remove('selected');
            messageInput.placeholder = '메시지 입력...';
            messageInput.disabled = false;
        };
        reader.readAsDataURL(file);
      } else if (message !== '') {
        socket.emit('chat message', { id, message });
        addMessageToChat(message, true);
      }

      messageInput.value = '';
      Chat.scrollTop = Chat.scrollHeight;
    });

    socket.on('chat message', (data) => {
      if (data.id !== socket.id) {
        addMessageToChat(data.message, false);
      }
    });

    socket.on('user count', (count) => {
        userCountDisplay.textContent = `현재 ${count}명이 활동 중`;
    });

    function addMessageToChat(content, isMe) {
      const li = document.createElement('li');
      if (isMe) {
        li.classList.add('me');
      }

      if (content.startsWith('data:image/')) {
        const img = document.createElement('img');
        img.src = content;
        img.style.maxWidth = '100%';
        li.classList.add('li-img');
        li.appendChild(img);
      } else {
        li.textContent = content;
      }

      Chat.appendChild(li);
      Chat.scrollTop = Chat.scrollHeight;
    }
  </script>
</body>
</html>
